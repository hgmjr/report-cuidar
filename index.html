<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador REPORT CUIDAR</title>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #cccccc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      height: 90px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .col {
      flex: 1;
    }
    .col-tipo {
      flex: 0.8;
    }
    .preview-box {
      background: #e5ddd5;
      padding: 12px;
      border-radius: 5px;
      white-space: pre-wrap;
      font-family: monospace, sans-serif;
      font-size: 13px;
      margin-top: 15px;
      border: 1px solid #d1c7bd;
    }
    .btn-copy {
      display: block;
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-copy:hover {
      background-color: #1ebd56;
    }
    .btn-clear {
      display: block;
      width: 100%;
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-clear:hover {
      background-color: #bd2130;
    }
    .status {
      text-align: center;
      color: #0056b3;
      font-weight: bold;
      margin-top: 8px;
      min-height: 20px;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #777;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🟦 Gerador REPORT CUIDAR</h2>

  <form id="reportForm">
    <div class="row">
      <div class="col form-group">
        <label for="equipe">👥 Equipe:</label>
        <input type="text" id="equipe">
      </div>
      <div class="col form-group">
        <label for="matricula">🧾 Matrícula:</label>
        <input type="text" id="matricula" oninput="this.value = this.value.replace(/[^0-9/]/g, '')">
      </div>
    </div>

    <div class="row">
      <div class="col-tipo form-group">
        <label for="tipoLogradouro">Tipo:</label>
        <select id="tipoLogradouro">
          <option value="RUA">RUA</option>
          <option value="AVENIDA">AVENIDA</option>
          <option value="TRAVESSA">TRAVESSA</option>
        </select>
      </div>
      <div class="col form-group">
        <label for="endereco">🛤️ Nome e Número:</label>
        <input type="text" id="endereco" placeholder="Ex: ITARUMA, 7">
      </div>
    </div>

    <div class="form-group">
      <label for="servico">🛠️ Serviço:</label>
      <input type="text" id="servico">
    </div>

    <div class="form-group">
      <label for="relato">🗣️ Relato:</label>
      <textarea id="relato"></textarea>
    </div>

    <div class="form-group">
      <label for="clienteCiente">👤 Cliente Ciente:</label>
      <select id="clienteCiente">
        <option value="" selected disabled>Selecione...</option>
        <option value="SIM">SIM</option>
        <option value="NAO">NÃO</option>
      </select>
    </div>

    <div class="row">
      <div class="col form-group">
        <label for="supervisor">✅ SUPERVISOR(A):</label>
        <input type="text" id="supervisor">
      </div>
      <div class="col form-group">
        <label for="lider">✅ Líder:</label>
        <input type="text" id="lider">
      </div>
    </div>
  </form>

  <label style="font-weight: bold; margin-top: 10px; display: block;">Pré-visualização para o WhatsApp:</label>
  <div class="preview-box" id="preview"></div>

  <button class="btn-copy" onclick="copiarMensagem()">Copiar para o WhatsApp</button>
  <button class="btn-clear" onclick="limparFormulario()">LIMPAR FORMULÁRIO</button>

  <div class="status" id="statusMsg"></div>

  <footer>
    DESENVOLVIDO por Hélcio Gomes
  </footer>
</div>

<script>
  function gerarTexto() {
    const equipe = document.getElementById('equipe').value || '';
    const tipoLogradouro = document.getElementById('tipoLogradouro').value || 'RUA';
    const endereco = document.getElementById('endereco').value || '';
    const ruaCompleta = endereco ? `${tipoLogradouro}: ${endereco}` : '';
    
    const matricula = document.getElementById('matricula').value || '';
    const servico = document.getElementById('servico').value || '';
    const relato = document.getElementById('relato').value || '';
    const clienteCiente = document.getElementById('clienteCiente').value;
    const supervisor = document.getElementById('supervisor').value || '';
    const lider = document.getElementById('lider').value || '';

    let simMarqued = '( )SIM ( )NAO';
    if (clienteCiente === 'SIM') {
      simMarqued = '(X)SIM ( )NAO';
    } else if (clienteCiente === 'NAO') {
      simMarqued = '( )SIM (X)NAO';
    }

    const textoFormatado = 
`🟦 *REPORT CUIDAR*

👥 *EQUIPE:* ${equipe}

🛤️ *LOCAL:* ${ruaCompleta}

🧾 *MATRÍCULA:* ${matricula}

🛠️ *SERVIÇO:* ${servico}

🗣️ *RELATO:* "${relato}"

👤 *CLIENTE CIENTE:* ${simMarqued}

✅ *SUPERVISOR(A):* ${supervisor}

✅ *LÍDER:* ${lider}

⭐ *PROFISSIONAL ALÉM DA CONTA*
🔥 *AEGEA CUIDA*`;

    document.getElementById('preview').textContent = textoFormatado;
    return textoFormatado;
  }

  // Atualiza em tempo real enquanto digita
  document.getElementById('reportForm').addEventListener('input', gerarTexto);
  document.getElementById('tipoLogradouro').addEventListener('change', gerarTexto);
  document.getElementById('clienteCiente').addEventListener('change', gerarTexto);

  // Inicializa o preview ao carregar a página
  gerarTexto();

  // Função para copiar o texto formatado
  function copiarMensagem() {
    const texto = gerarTexto();
    navigator.clipboard.writeText(texto).then(() => {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.textContent = '✅ Report copiado para a área de transferência!';
      setTimeout(() => {
        statusDiv.textContent = '';
      }, 3000);
    }).catch(err => {
      alert('Erro ao copiar texto: ', err);
    });
  }

  // Função para limpar totalmente todos os campos
  function limparFormulario() {
    document.getElementById('reportForm').reset();
    document.getElementById('clienteCiente').selectedIndex = 0;
    document.getElementById('tipoLogradouro').selectedIndex = 0;
    gerarTexto();

    const statusDiv = document.getElementById('statusMsg');
    statusDiv.textContent = '🧹 Formulário limpo com sucesso!';
    setTimeout(() => {
      statusDiv.textContent = '';
    }, 2500);
  }
</script>

</body>
</html>
