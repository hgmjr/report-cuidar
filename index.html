<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador REPORT CUIDAR</title>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #cccccc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #333;
      min-height: 100vh;
      min-height: 100dvh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #05e5c8 var(--bg-art) center center / cover no-repeat;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.78);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }
    h2 {
      margin-top: 0;
      color: #003d80;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.9);
    }
    textarea {
      resize: vertical;
      height: 90px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .col {
      flex: 1;
    }
    .col-tipo {
      flex: 0.8;
    }
    .preview-box {
      background: #e5ddd5;
      padding: 12px;
      border-radius: 5px;
      white-space: pre-wrap;
      font-family: monospace, sans-serif;
      font-size: 13px;
      margin-top: 15px;
      border: 1px solid #d1c7bd;
    }
    .btn-copy {
      display: block;
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn-copy:hover {
      background-color: #1ebd56;
    }
    .btn-clear {
      display: block;
      width: 100%;
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-clear:hover {
      background-color: #bd2130;
    }
    .status {
      text-align: center;
      color: #0056b3;
      font-weight: bold;
      margin-top: 8px;
      min-height: 20px;
    }
    .logo-wrap {
      text-align: center;
      margin-top: 22px;
    }
    .logo-wrap img {
      width: 55%;
      max-width: 200px;
      height: auto;
    }
    footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #444;
      font-weight: 500;
    }

    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
    .header-row h2 { margin: 0; }
    .btn-theme {
      flex: none; background: #fff; color: #333; border: 1px solid var(--border);
      border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    label.required::after { content: " *"; color: #dc3545; }
    .invalid {
      border-color: #dc3545 !important; background: #fff0f1 !important;
      box-shadow: 0 0 0 2px rgba(220,53,69,0.25);
    }
    .field-error { display: none; color: #dc3545; font-size: 12px; font-weight: bold; margin-top: 3px; }
    .form-group.has-error .field-error { display: block; }
    .btn-copy.copied { background-color: #14803c; }
    .btn-whats {
      display: block; width: 100%; background-color: #128c7e; color: #fff; border: none;
      padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px;
    }
    .btn-whats:hover { background-color: #0e6f64; }
    .btn-link {
      display: block; margin: 12px auto 0; background: none; border: none; color: #444;
      font-size: 12px; text-decoration: underline; cursor: pointer;
    }
    .status.ok  { color: #14803c; background: #d4edda; border: 1px solid #b7dfc3; border-radius: 5px; padding: 8px; }
    .status.err { color: #842029; background: #f8d7da; border: 1px solid #f1aeb5; border-radius: 5px; padding: 8px; }

    /* ===== Tema escuro / alto contraste ===== */
    html[data-theme="dark"] body::before {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), var(--bg-art) center center / cover no-repeat, #05211d;
    }
    html[data-theme="dark"] body { color: #f5f5f5; }
    html[data-theme="dark"] .container { background: rgba(16,20,26,0.92); border-color: rgba(255,255,255,0.15); }
    html[data-theme="dark"] h2 { color: #8ec5ff; }
    html[data-theme="dark"] input,
    html[data-theme="dark"] select,
    html[data-theme="dark"] textarea { background: #1f2630; color: #fff; border-color: #5a6678; }
    html[data-theme="dark"] .invalid { background: #3a1a1f !important; border-color: #ff6b78 !important; }
    html[data-theme="dark"] .field-error { color: #ff8a95; }
    html[data-theme="dark"] .preview-box { background: #0b141a; color: #e9edef; border-color: #2a3942; }
    html[data-theme="dark"] .btn-theme { background: #1f2630; color: #fff; border-color: #5a6678; }
    html[data-theme="dark"] .btn-link { color: #cfd6df; }
    html[data-theme="dark"] footer { color: #d5dbe3; border-top-color: #333; }
    html[data-theme="dark"] .status { color: #8ec5ff; }
    html[data-theme="dark"] .status.ok  { color: #9be3b2; background: #123d22; border-color: #1f6b3b; }
    html[data-theme="dark"] .status.err { color: #ffb3bb; background: #4a1a20; border-color: #8a2c37; }
    html[data-theme="dark"] .logo-wrap img { background: #fff; border-radius: 8px; padding: 8px; box-sizing: border-box; }
  </style>
<script>
    try {
      var t = localStorage.getItem('tema');
      if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2>🟦 Gerador REPORT CUIDAR</h2>
    <button type="button" class="btn-theme" id="btnTema">🌙 Escuro</button>
  </div>

  <form id="reportForm" novalidate>
    <div class="row">
      <div class="col form-group">
        <label class="required" for="equipe">👥 Equipe:</label>
        <input type="text" id="equipe" autocomplete="off">
        <div class="field-error">Informe a equipe</div>
      </div>
      <div class="col form-group">
        <label class="required" for="matricula">🧾 Matrícula:</label>
        <input type="text" id="matricula" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9/]/g, '')">
        <div class="field-error">Informe a matrícula</div>
      </div>
    </div>

    <div class="row">
      <div class="col-tipo form-group">
        <label for="tipoLogradouro">Tipo:</label>
        <select id="tipoLogradouro">
          <option value="RUA">RUA</option>
          <option value="AVENIDA">AVENIDA</option>
          <option value="TRAVESSA">TRAVESSA</option>
        </select>
      </div>
      <div class="col form-group">
        <label class="required" for="endereco">🛤️ Nome e Número:</label>
        <input type="text" id="endereco" placeholder="Ex: Julio Verne, 980">
        <div class="field-error">Informe o endereço</div>
      </div>
    </div>

    <div class="form-group">
      <label class="required" for="servico">🛠️ Serviço:</label>
      <input type="text" id="servico">
      <div class="field-error">Informe o serviço</div>
    </div>

    <div class="form-group">
      <label class="required" for="relato">🗣️ Relato:</label>
      <textarea id="relato"></textarea>
      <div class="field-error">Escreva o relato</div>
    </div>

    <div class="form-group">
      <label class="required" for="clienteCiente">👤 Cliente Ciente:</label>
      <select id="clienteCiente">
        <option value="" selected disabled>Selecione...</option>
        <option value="SIM">SIM</option>
        <option value="NAO">NÃO</option>
      </select>
      <div class="field-error">Selecione SIM ou NÃO</div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label class="required" for="supervisor">✅ SUPERVISOR(A):</label>
        <input type="text" id="supervisor">
        <div class="field-error">Informe o(a) supervisor(a)</div>
      </div>
      <div class="col form-group">
        <label class="required" for="lider">✅ Líder:</label>
        <input type="text" id="lider">
        <div class="field-error">Informe o líder</div>
      </div>
    </div>
  </form>

  <label style="font-weight: bold; margin-top: 10px; display: block;">Pré-visualização para o WhatsApp:</label>
  <div class="preview-box" id="preview"></div>

  <button class="btn-copy" id="btnCopiar" onclick="copiarMensagem()">Copiar para o WhatsApp</button>
  <button class="btn-whats" onclick="enviarWhatsApp()">📲 Enviar direto no WhatsApp</button>
  <button class="btn-clear" onclick="limparFormulario()">LIMPAR FORMULÁRIO</button>
  <button class="btn-link" type="button" onclick="apagarSalvos()">Apagar dados salvos (equipe, matrícula, supervisor, líder)</button>

<script>
  // Rodapé automático (letras pequenas) – anexado sempre ao texto copiado
  function miniatura(txt) {
    const mapa = {a:'ᵃ',b:'ᵇ',c:'ᶜ',d:'ᵈ',e:'ᵉ',f:'ᶠ',g:'ᵍ',h:'ʰ',i:'ⁱ',j:'ʲ',k:'ᵏ',l:'ˡ',m:'ᵐ',n:'ⁿ',o:'ᵒ',p:'ᵖ',r:'ʳ',s:'ˢ',t:'ᵗ',u:'ᵘ',v:'ᵛ',w:'ʷ',x:'ˣ',y:'ʸ',z:'ᶻ'};
    return txt.toLowerCase().split('').map(c => mapa[c] || c).join('');
  }
  const RODAPE_COPIA = '\n\n' + miniatura('gerador report cuidar');

  const $ = id => document.getElementById(id);
  const CAMPOS_FIXOS = ['equipe', 'matricula', 'supervisor', 'lider'];
  const CAMPOS_OBRIGATORIOS = ['equipe', 'matricula', 'endereco', 'servico', 'relato', 'clienteCiente', 'supervisor', 'lider'];
  const CHAVE_FIXOS = 'reportCuidarFixos';

  /* ---------- Dados fixos (localStorage) ---------- */
  function salvarFixos() {
    try {
      const d = {};
      CAMPOS_FIXOS.forEach(id => d[id] = $(id).value);
      localStorage.setItem(CHAVE_FIXOS, JSON.stringify(d));
    } catch (e) {}
  }
  function carregarFixos() {
    try {
      const d = JSON.parse(localStorage.getItem(CHAVE_FIXOS) || '{}');
      CAMPOS_FIXOS.forEach(id => { if (d[id]) $(id).value = d[id]; });
    } catch (e) {}
  }
  function apagarSalvos() {
    try { localStorage.removeItem(CHAVE_FIXOS); } catch (e) {}
    CAMPOS_FIXOS.forEach(id => $(id).value = '');
    gerarTexto();
    mostrarStatus('🗑️ Dados salvos apagados.', 'ok', 2500);
  }

  /* ---------- Tema claro / escuro ---------- */
  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('btnTema').textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
    $('btnTema').setAttribute('aria-label', t === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro');
  }
  $('btnTema').addEventListener('click', () => {
    const novo = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    aplicarTema(novo);
    try { localStorage.setItem('tema', novo); } catch (e) {}
  });

  /* ---------- Data e hora ---------- */
  function dataHoraAtual() {
    const n = new Date();
    const p = x => String(x).padStart(2, '0');
    return `${p(n.getDate())}/${p(n.getMonth() + 1)}/${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}`;
  }

  /* ---------- Texto do report ---------- */
  function gerarTexto() {
    const equipe = $('equipe').value || '';
    const tipoLogradouro = $('tipoLogradouro').value || 'RUA';
    const endereco = $('endereco').value || '';
    const ruaCompleta = endereco ? `${tipoLogradouro}: ${endereco}` : '';

    const matricula = $('matricula').value || '';
    const servico = $('servico').value || '';
    const relato = $('relato').value || '';
    const clienteCiente = $('clienteCiente').value;
    const supervisor = $('supervisor').value || '';
    const lider = $('lider').value || '';

    let simMarqued = '( )SIM ( )NAO';
    if (clienteCiente === 'SIM') {
      simMarqued = '(X)SIM ( )NAO';
    } else if (clienteCiente === 'NAO') {
      simMarqued = '( )SIM (X)NAO';
    }

    const textoFormatado =
`🟦 *REPORT CUIDAR*

📅 *DATA/HORA:* ${dataHoraAtual()}

👥 *EQUIPE:* ${equipe}

🛤️ *LOCAL:* ${ruaCompleta}

🧾 *MATRÍCULA:* ${matricula}

🛠️ *SERVIÇO:* ${servico}

🗣️ *RELATO:* "${relato}"

👤 *CLIENTE CIENTE:* ${simMarqued}

✅ *SUPERVISOR(A):* ${supervisor}

✅ *LÍDER:* ${lider}

⭐ *PROFISSIONAL ALÉM DA CONTA*
🔥 *AEGEA CUIDA*`;

    $('preview').textContent = textoFormatado + RODAPE_COPIA;
    return textoFormatado + RODAPE_COPIA;
  }

  /* ---------- Validação ---------- */
  function marcarErro(el, comErro) {
    el.classList.toggle('invalid', comErro);
    const grupo = el.closest('.form-group');
    if (grupo) grupo.classList.toggle('has-error', comErro);
  }
  function validar() {
    let primeiro = null;
    CAMPOS_OBRIGATORIOS.forEach(id => {
      const el = $(id);
      const vazio = !el.value || !el.value.trim();
      marcarErro(el, vazio);
      if (vazio && !primeiro) primeiro = el;
    });
    if (primeiro) {
      primeiro.scrollIntoView({ behavior: 'smooth', block: 'center' });
      primeiro.focus({ preventScroll: true });
      return false;
    }
    return true;
  }

  /* ---------- Feedback ---------- */
  let timerStatus;
  function mostrarStatus(msg, tipo, ms) {
    const s = $('statusMsg');
    s.textContent = msg;
    s.className = 'status ' + (tipo || '');
    clearTimeout(timerStatus);
    timerStatus = setTimeout(() => { s.textContent = ''; s.className = 'status'; }, ms || 3000);
  }

  /* ---------- Copiar / enviar ---------- */
  function copiarTexto(t) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise((ok, falha) => {
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy') ? ok() : falha(); } catch (e) { falha(e); }
      document.body.removeChild(ta);
    });
  }

  function copiarMensagem() {
    if (!validar()) {
      mostrarStatus('⚠️ Preencha os campos destacados em vermelho.', 'err', 4000);
      return;
    }
    copiarTexto(gerarTexto()).then(() => {
      const b = $('btnCopiar');
      b.classList.add('copied');
      b.textContent = '✅ Copiado!';
      setTimeout(() => { b.classList.remove('copied'); b.textContent = 'Copiar para o WhatsApp'; }, 2000);
      mostrarStatus('✅ Copiado! Agora é só colar no WhatsApp.', 'ok', 3000);
    }).catch(() => {
      mostrarStatus('❌ Não foi possível copiar. Selecione o texto da pré-visualização e copie manualmente.', 'err', 5000);
    });
  }

  // Abre o WhatsApp direto na escolha de contato/grupo
  function enviarWhatsApp() {
    if (!validar()) {
      mostrarStatus('⚠️ Preencha os campos destacados em vermelho.', 'err', 4000);
      return;
    }
    const url = 'https://wa.me/?text=' + encodeURIComponent(gerarTexto());
    const w = window.open(url, '_blank');
    if (!w) window.location.href = url;
  }

  /* ---------- Limpar ---------- */
  function limparFormulario() {
    ['endereco', 'servico', 'relato'].forEach(id => $(id).value = '');
    $('clienteCiente').selectedIndex = 0;
    $('tipoLogradouro').selectedIndex = 0;
    CAMPOS_OBRIGATORIOS.forEach(id => marcarErro($(id), false));
    gerarTexto();
    mostrarStatus('🧹 Formulário limpo (equipe, matrícula, supervisor e líder foram mantidos).', 'ok', 3000);
  }

  /* ---------- Eventos ---------- */
  function aoEditar(e) {
    const el = e.target;
    if (el && el.id) {
      if (CAMPOS_FIXOS.includes(el.id)) salvarFixos();
      if (el.value && el.value.trim()) marcarErro(el, false);
    }
    gerarTexto();
  }
  $('reportForm').addEventListener('input', aoEditar);
  $('reportForm').addEventListener('change', aoEditar);

  carregarFixos();
  aplicarTema(document.documentElement.getAttribute('data-theme') || 'light');
  gerarTexto();
  setInterval(gerarTexto, 30000); // mantém o horário da pré-visualização atualizado

</script>
